    <script>
      // 지난번에 회원이었으면 JS가 뜨기 전부터 다크로 둔다 (최종 판단은 앱의 /auth/me)

        if (localStorage.getItem('gdghost.lastSession') === 'member') document.documentElement.classList.add('dark')
      } catch (e) {}

      .startup-brand { color: #2f6e73; } .dark .startup-brand { color: #a9c7ff; }
      .startup-dots { display: flex; gap: 0.5rem; }
      .startup-dots span { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: #f5b952; }
      @keyframes startup-dot {
        0%, 60%, 100% { transform: translateY(0); opacity: 0.55; animation-timing-function: ease-out; }
        25% { transform: translateY(-4px); opacity: 1; animation-timing-function: ease-in; }
      }
      @media (prefers-reduced-motion: no-preference) {
        .startup-dots span { animation: startup-dot 1.2s infinite both; }
        .startup-dots span:nth-child(2) { animation-delay: 160ms; }
        .startup-dots span:nth-child(3) { animation-delay: 320ms; }
      }
      .startup-failure { display: none; text-align: center; font: 400 1rem/1.5 system-ui, sans-serif; }
      #startup-splash[data-failed] .startup-content { display: none; }
      #startup-splash[data-failed] .startup-failure { display: block; }
    </style>
    <noscript><style>#startup-splash { display: none; }</style></noscript>
  </head>
  <body>
    <div id="root"></div>
    <div id="startup-splash">
      <div class="startup-content" role="status" aria-label="불러오는 중">
        <div class="startup-mascot" aria-hidden="true"></div>
        <div class="startup-dots" aria-hidden="true"><span></span><span></span><span></span></div>
        <span><span class="startup-brand">GDG</span>host</span>
      </div>
      <p class="startup-failure" role="alert">앱을 불러오지 못했어요. 페이지를 새로고침해 주세요.</p>
    </div>
    <noscript>GDGhost를 열려면 브라우저에서 JavaScript를 켜 주세요.</noscript>
    <!-- 앱의 CSS가 초기 HTML 렌더링을 막지 않도록 앱을 동적으로 불러온다. -->
    <script type="module">
      import('/src/main.tsx').catch((error) => {
        console.error(error)
        document.getElementById('startup-splash').setAttribute('data-failed', '')
      })
    </script>
  </body>
</html>
